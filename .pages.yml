media:
  - name: images
    label: تصاویر
    input: public/images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: products
    label: محصولات
    type: collection
    path: content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, model, order, image]
      primary: slug
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: شناسه
        type: string
        required: true
        description: "آدرس محصول، مثلا jaqashqi-1"
      - name: title
        label: نام محصول
        type: string
        required: true
      - name: category
        label: دسته‌بندی
        type: select
        options:
          values:
            - استند
            - راف چوبی
            - جالیوانی
            - جاقاشقی
            - جاظرفی
            - جا اسکاچی
            - جا دستمال
            - زیر دیگی
            - ست سینک
            - کنار گازی
      - name: material
        label: جنس
        type: select
        options:
          values:
            - فلز
            - استیل
            - چوب
      - name: tags
        label: برچسب‌ها
        type: string
        list: true
      - name: image
        label: عکس
        type: image
        required: true
        options:
          media: images
      - name: model
        label: کد کالا
        type: string
      - name: pcs
        label: تعداد در کارتن
        type: number
      - name: size
        label: ابعاد
        type: string
      - name: order
        label: ترتیب
        type: number
      - name: body
        label: توضیحات
        type: rich-text
        options:
          format: markdown
          media: images

  - name: site
    label: تنظیمات سایت
    type: file
    path: content/site.md
    format: yaml-frontmatter
    fields:
      - name: company
        label: شرکت
        type: object
        fields:
          - name: name
            label: نام شرکت
            type: string
            required: true
          - name: logo
            label: لوگو
            type: image
            options:
              media: images
          - name: email
            label: ایمیل
            type: string
          - name: phones
            label: تلفن‌ها
            type: string
            list: true
      - name: hero
        label: صفحه اصلی
        type: object
        fields:
          - name: title
            label: عنوان
            type: string
          - name: image
            label: عکس هدر
            type: image
            options:
              media: images
      - name: social
        label: شبکه‌های اجتماعی
        type: object
        fields:
          - name: handle
            label: نام کاربری
            type: string
          - name: instagram
            label: اینستاگرام
            type: string
          - name: telegram
            label: تلگرام
            type: string
      - name: body
        label: توضیح هدر
        type: rich-text
        options:
          format: markdown
          media: images

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
