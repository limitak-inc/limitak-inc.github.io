media:
  - name: images
    label: Images
    input: public/images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: products
    label: Products
    type: collection
    path: content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, model, size, image]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Product Name
        type: string
        required: true
      - name: image
        label: Product Image
        type: image
        options:
          media: images
      - name: model
        label: Model
        type: string
      - name: size
        label: Size
        type: string
      - name: body
        label: Description
        type: rich-text
        options:
          format: markdown
          media: images

  - name: site
    label: Site Settings
    type: file
    path: content/site.md
    format: yaml-frontmatter
    fields:
      - name: company
        label: Company
        type: object
        fields:
          - name: name
            label: Company Name
            type: string
            required: true
          - name: phone
            label: Phone
            type: string
          - name: email
            label: Email
            type: string
          - name: address
            label: Address
            type: text
      - name: hero
        label: Hero
        type: object
        fields:
          - name: title
            label: Hero Title
            type: string
          - name: image
            label: Hero Image
            type: image
            options:
              media: images
      - name: footer
        label: Footer
        type: object
        fields:
          - name: copyright
            label: Copyright
            type: string
          - name: links
            label: Footer Links
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: url
                label: URL
                type: string
      - name: body
        label: Hero Description
        type: rich-text
        options:
          format: markdown
          media: images

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
