media:
  - name: images
    label: تصاویر
    input: public/images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
  - name: logos
    label: لوگوها
    input: public/assets
    output: /assets
    rename: safe
    extensions: [png, svg, webp]

components:
  seo:
    type: object
    label: SEO
    fields:
      - name: title
        label: عنوان متا
        type: string
        description: "خالی = عنوان صفحه"
      - name: description
        label: توضیح متا
        type: text
      - name: image
        label: تصویر اشتراک‌گذاری
        type: image
        options:
          media: images
      - name: noindex
        label: عدم نمایه‌سازی
        type: boolean

content:
  - name: categories
    label: دسته‌بندی‌ها
    type: collection
    path: content/categories
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      fields: [label, slug, order]
      primary: label
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: شناسه
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: label
        label: نام
        type: string
        required: true
      - name: order
        label: ترتیب
        type: number
        options:
          min: 0

  - name: products
    label: محصولات
    type: collection
    path: content/products
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      fields: [title, slug, category, model, order, image]
      primary: title
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: شناسه
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "آدرس محصول، مثلا jaqashqi-1"
      - name: title
        label: نام محصول
        type: string
        required: true
      - name: category
        label: دسته‌بندی
        type: reference
        required: true
        options:
          collection: categories
          search: "label,slug"
          value: "{fields.slug}"
          label: "{fields.label}"
      - name: material
        label: جنس
        type: select
        options:
          values:
            - فلز
            - استیل
            - چوب
            - چوب و فلز
            - چوب و استیل
      - name: tags
        label: برچسب‌ها
        type: string
        list: true
      - name: image
        label: عکس
        type: image
        required: true
        options:
          media: images
      - name: model
        label: کد کالا
        type: string
      - name: pcs
        label: تعداد در کارتن
        type: number
        options:
          min: 0
      - name: size
        label: ابعاد
        type: string
      - name: order
        label: ترتیب
        type: number
        options:
          min: 0
      - name: body
        label: توضیحات
        type: rich-text
        options:
          format: markdown
          media: images
      - name: seo
        component: seo
        label: SEO

  - name: site
    label: تنظیمات سایت
    type: file
    path: content/site.md
    format: yaml-frontmatter
    operations:
      delete: false
      rename: false
    fields:
      - name: company
        label: شرکت
        type: object
        fields:
          - name: name
            label: نام شرکت
            type: string
            required: true
          - name: logo
            label: لوگوی نوار
            type: image
            options:
              media: logos
          - name: logoFooter
            label: لوگوی پاورقی
            type: image
            options:
              media: logos
          - name: logoFull
            label: لوگوی کامل
            type: image
            options:
              media: logos
          - name: favicon
            label: آیکون تب
            type: image
            options:
              media: logos
          - name: email
            label: ایمیل
            type: string
          - name: phones
            label: تلفن‌ها
            type: string
            list: true
      - name: hero
        label: صفحه اصلی
        type: object
        fields:
          - name: title
            label: عنوان
            type: string
            required: true
          - name: image
            label: عکس هدر
            type: image
            required: true
            options:
              media: images
      - name: theme
        label: ظاهر
        type: object
        fields:
          - name: bg-page
            label: پس‌زمینه صفحه
            type: select
            options:
              values:
                - { name: "hsl(229 85% 5%)", label: سربی }
                - { name: "hsl(240 11% 4%)", label: فلزی }
                - { name: "hsl(20 14% 4%)", label: سنگی }
                - { name: "hsl(300 14% 4%)", label: یاسی }
                - { name: "hsl(200 14% 4%)", label: مه‌آلود }
                - { name: "hsl(60 14% 4%)", label: زیتونی }
          - name: bg-surface
            label: سطح
            type: select
            options:
              values:
                - { name: "hsl(217 36% 18% / 0.6)", label: سربی }
                - { name: "hsl(240 4% 16% / 0.6)", label: فلزی }
                - { name: "hsl(12 7% 15% / 0.6)", label: سنگی }
                - { name: "hsl(289 14% 15% / 0.6)", label: یاسی }
                - { name: "hsl(193 12% 15% / 0.6)", label: مه‌آلود }
                - { name: "hsl(60 12% 15% / 0.6)", label: زیتونی }
          - name: accent-solid
            label: تاکید
            type: select
            options:
              values:
                - { name: "hsl(30 100% 45%)", label: نارنجی }
                - { name: "hsl(16 100% 40%)", label: مسی }
                - { name: "hsl(34 100% 33%)", label: طلایی }
          - name: accent-muted
            label: تاکید ملایم
            type: select
            options:
              values:
                - { name: "hsl(30 100% 45% / 0.16)", label: نارنجی }
                - { name: "hsl(16 100% 40% / 0.16)", label: مسی }
                - { name: "hsl(34 100% 33% / 0.16)", label: طلایی }
      - name: social
        label: شبکه‌های اجتماعی
        type: object
        fields:
          - name: handle
            label: نام کاربری
            type: string
          - name: instagram
            label: اینستاگرام
            type: string
          - name: telegram
            label: تلگرام
            type: string
          - name: whatsapp
            label: واتساپ
            type: string
      - name: body
        label: توضیح هدر
        type: rich-text
        options:
          format: markdown
          media: images
      - name: seo
        component: seo
        label: SEO
      - name: faq
        label: سوالات متداول
        type: object
        list: true
        fields:
          - name: q
            label: سوال
            type: string
          - name: a
            label: پاسخ
            type: text

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"
